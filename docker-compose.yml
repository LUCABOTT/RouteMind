
services:
  postgres:
    image: postgres:16-alpine
    container_name: routemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routemind_db
      POSTGRES_USER: routemind_user
      POSTGRES_PASSWORD: routemind_dev_password
    ports:
      - "5432:5432"
    volumes:
      - routemind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routemind_user -d routemind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  routemind_postgres_data:
